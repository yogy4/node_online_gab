services:
 notes:
  image: nodejsapi:0.1
  build:
   context: .
  ports:
   - 8080:8080
   - 9229:9229
  environment:
   - SERVER_PORT=8080
   - CONNECTIONSTRING=mongodb://mongo:27017/datacomment
  volumes:
   - ./:/app
  command: npm run start

 mongo:
  image: mongo:4.4.0
  ports:
   - 27017:27017
  volumes:
   - mongodb:/data/db
   - mongodb_config:/data/configdb
volumes:
 mongodb:
 mongodb_config: